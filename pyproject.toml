[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scamalyser"
version = "0.1.0"
description = "Explainable phishing email analyser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tldextract>=5.0"]

[project.optional-dependencies]
online = ["dnspython>=2.4", "dkimpy>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
scamalyser = "scamalyser.cli:main"

[tool.setuptools.packages.find]
include = ["scamalyser*"]
